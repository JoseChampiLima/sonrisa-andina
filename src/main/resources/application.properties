spring.application.name=sonrisa-andina
spring.config.import=optional:file:./.env[.properties]

# ======================= Servidor =======================
server.port=8080

# ======================= Conexion a MySQL por variables de entorno =======================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======================= JPA / Hibernate =======================
# update: crea y actualiza las tablas automaticamente en la base local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ======================= Thymeleaf =======================
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# ======================= Zona horaria =======================
spring.jackson.time-zone=America/Lima

# ======================= Reglas del negocio =======================
# Horas de anticipacion del recordatorio automatico
clinica.recordatorios.horas-anticipacion=24
# Cada cuantos milisegundos el planificador revisa recordatorios pendientes
clinica.recordatorios.intervalo-ms=60000
# Granularidad (en minutos) de los horarios ofrecidos en la agenda
clinica.agenda.paso-minutos=15

# ======================= Seguridad JWT (API REST) =======================
clinica.jwt.secret=${JWT_SECRET}
clinica.jwt.expiracion-horas=8

# ======================= Correo (opcional) =======================
# Si no se configura un servidor SMTP, los recordatorios por correo se
# registran en el log y en la bandeja del sistema (modo demostracion).
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ======================= Logs =======================
logging.level.pe.edu.clinica.sonrisa_andina=INFO
