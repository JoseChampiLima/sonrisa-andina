spring.application.name=sonrisa-andina

# ======================= Servidor =======================
server.port=8080

# ======================= Conexion a MySQL local =======================
spring.datasource.url=jdbc:mysql://localhost:3306/bdsonrisaandina?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======================= JPA / Hibernate =======================
# update: crea y actualiza las tablas automaticamente en la base local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ======================= Thymeleaf =======================
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# ======================= Zona horaria =======================
spring.jackson.time-zone=America/Lima

# ======================= Reglas del negocio =======================
# Horas de anticipacion del recordatorio automatico
clinica.recordatorios.horas-anticipacion=24
# Cada cuantos milisegundos el planificador revisa recordatorios pendientes
clinica.recordatorios.intervalo-ms=60000
# Granularidad (en minutos) de los horarios ofrecidos en la agenda
clinica.agenda.paso-minutos=15

# ======================= Seguridad JWT (API REST) =======================
clinica.jwt.secret=SonrisaAndina-Clave-Secreta-JWT-2026-CambiarEnProduccion-0123456789
clinica.jwt.expiracion-horas=8

# ======================= Correo (opcional) =======================
# Si no se configura un servidor SMTP, los recordatorios por correo se
# registran en el log y en la bandeja del sistema (modo demostracion).
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=correo@clinica.pe
# spring.mail.password=clave
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ======================= Logs =======================
logging.level.pe.edu.clinica.sonrisa_andina=INFO
